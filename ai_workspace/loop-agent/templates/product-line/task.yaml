schema_version: 1
id: BE-001
feature_id: F-YYYY-NNN
title: <Bounded tracer-bullet task>
description: <Observable delivery>
repo:
  name: <repository-name>
  path_ref: <repository-path-reference>
  default_branch: main
type: backend-feature
priority: P1
risk_level: medium
depends_on: []
source_docs:
  requirement: ../requirement.md
  acceptance: ../acceptance.yaml
  design: ../design.md
  test_plan: ../test-plan.md
acceptance_refs:
  - AC-FEATURE-001
scope:
  goals:
    - <goal>
  non_goals:
    - <non-goal>
constraints:
  allowed_paths:
    - <owned/path/**>
  forbidden_paths:
    - <protected/path/**>
  hard_constraints:
    - Do not access production secrets
# Explicit runtime workflow → taskKind. For fullstack-v1 packets this should be set
# on every TaskSpec. Allowed: agent-dag | frontend-implementation | backend-test | frontend-test
execution:
  workflow: agent-dag
verify:
  preset: standard
  mode: serial
  commands:
    - id: focused-test
      label: Focused deterministic verification
      command: <project-specific verification command>
      required: true
      timeout_ms: 300000
worker:
  execution_mode: generate-validate-run
  max_attempts: 1
  timeout_ms: 7200000
  require_clean_worktree: true
  require_human_review: true
  create_worktree: false
loop_agent:
  profile_policy: mapped
  strict_models: true
  strict_governance: true
  max_concurrent: 1
outputs:
  required:
    - dag_json
    - run_record
    - shell_verification
    - diff_patch
    - closeout_or_failure_handoff
failure_policy:
  failed_run_promote: false
  generate_closeout_draft: true
  create_followup_task: true
