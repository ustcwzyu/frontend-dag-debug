schema_version: 1
id: CONTRACT-001
feature_id: F-2099-903
title: Scaffold sample — fe-with-api — API 契约
description: 冻结 docs/contracts/F-2099-903/api.md；正式 consumers 仅为 BE-IMPL-001 与 FE-IMPL-001。
repo:
  name: loop-agent
  path_ref: .
  default_branch: main
type: architecture
priority: P1
risk_level: low
depends_on: []
source_docs:
  requirement: ../requirement.md
  acceptance: ../acceptance.yaml
  design: ../design.md
acceptance_refs:
  - AC-001
scope:
  goals:
    - 冻结 API 契约文档
    - 声明正式 consumers 仅为 BE-IMPL / FE-IMPL
  non_goals:
    - 不扩展到模板外的 Task 节点（无 BE-TEST/FE-TEST/FINAL-VERIFY）
  assumptions:
    - verify.commands 由 scaffold 调用方显式提供
  open_questions: []
constraints:
  allowed_paths:
    - docs/contracts/F-2099-903/api.md
    - docs/progress/F-2099-903/contract/status.md
    - docs/progress/F-2099-903/contract/**
  forbidden_paths:
    - config/prod/**
    - .env
    - .env.*
    - secrets/**
    - services/**
    - apps/**
  hard_constraints:
    - 不读取生产密钥
    - 不绕过 scaffold 冻结的 depends/produces/consumes
execution:
  workflow: agent-dag
verify:
  preset: standard
  mode: serial
  quota: full
  commands:
    - id: verify-1
      label: npm run typecheck
      command: npm run typecheck
      required: true
      timeout_ms: 300000
    - id: verify-2
      label: npm test
      command: npm test
      required: true
      timeout_ms: 300000
worker:
  execution_mode: generate-validate-run
  max_attempts: 1
  timeout_ms: 7200000
  require_clean_worktree: true
  require_human_review: true
  create_worktree: false
loop_agent:
  profile_policy: mapped
  strict_models: true
  strict_governance: true
  max_concurrent: 1
outputs:
  required:
    - dag_json
    - dag_validate_json
    - run_record
    - dag_report_json
    - shell_verification
    - closeout_or_failure_handoff
failure_policy:
  failed_run_promote: false
  generate_closeout_draft: true
  create_followup_task: true
